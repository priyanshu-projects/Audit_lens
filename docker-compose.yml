version: "3.9"

# ── Local development compose ──────────────────────────────────────────────
# Usage:
#   docker-compose up           → start Streamlit dashboard
#   docker-compose up --build   → rebuild image first
#   docker-compose down         → stop and remove containers
#
# App will be available at: http://localhost:8501

services:

  # ── Main app (Streamlit dashboard) ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: auditlens-app
    ports:
      - "8501:8501"
    volumes:
      # Mount data dir so FAISS index and PDFs persist between runs
      - ./data:/app/data
      # Mount models dir (for local fine-tuned model)
      - ./models:/app/models
      # Mount reports dir
      - ./reports:/app/reports
      # Hot reload: mount source code for dev (comment out for prod)
      - ./src:/app/src
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MLflow tracking server (optional — for local experiment tracking) ─────
  mlflow:
    image: python:3.11-slim
    container_name: auditlens-mlflow
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:///mlruns/mlflow.db
               --default-artifact-root /mlruns/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    profiles:
      - mlflow   # only starts with: docker-compose --profile mlflow up
