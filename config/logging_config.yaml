logging:
  version: 1
  disable_existing_loggers: false

  formatters:
    json:
      # Structured JSON logs — Cloud Run / Cloud Logging compatible
      format: "%(asctime)s %(name)s %(levelname)s %(message)s"
      class: pythonjsonlogger.jsonlogger.JsonFormatter

    console:
      format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
      datefmt: "%H:%M:%S"

  handlers:
    console:
      class: logging.StreamHandler
      stream: ext://sys.stdout
      formatter: console

    json_console:
      class: logging.StreamHandler
      stream: ext://sys.stdout
      formatter: json

  root:
    level: INFO
    handlers: [console]

  loggers:
    auditlens:
      level: INFO
      handlers: [console]
      propagate: false

    auditlens.ingestion:
      level: DEBUG

    auditlens.classification:
      level: INFO

    auditlens.rag:
      level: INFO

    auditlens.mlops:
      level: INFO

    # Suppress noisy library logs
    transformers:
      level: WARNING
    sentence_transformers:
      level: WARNING
    faiss:
      level: WARNING
    urllib3:
      level: WARNING
